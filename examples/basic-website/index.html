<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TelcoAds Web SDK v2 — Ví dụ tích hợp cơ bản</title>
</head>
<body>
  <h1>TelcoAds Web SDK v2 — Ví dụ tích hợp cơ bản</h1>
  <p>Mở trang bằng 4G Viettel để nhận <code>sid</code>; Wi-Fi sẽ trả <code>null</code>. Mở Console (F12) để xem log.</p>
  <p>Kết quả: <code id="result">đang lấy sid…</code></p>

  <script src="https://cdn.jsdelivr.net/gh/BigDataServices-ViettelTelecom/telcoads-webapp-sdk@v2.0.1/dist/telcoads-sdk-v2.min.js"
          integrity="sha384-zyIFGucuXHVBakv1SMNADojUXbENS8WxfVKkyKt5qzLI2IYxhdMJyZx8qSK0Ldmj"
          crossorigin="anonymous"></script>
  <script>
    TelcoAds.init({
      siteId:   'demo-site',        // thay bằng siteId đã đăng ký với TelcoAds
      clientId: 'demo-client-id',   // thay bằng clientId TelcoAds cấp
      timeoutMs: 10000,             // chờ /ident tối đa 10 giây (giai đoạn pilot)
      debug:    true                // tắt khi lên production
    });

    // tại thời điểm gửi ad request:
    TelcoAds.getSid().then(function (sid) {
      document.getElementById('result').textContent = sid ? sid : 'null (gửi ad request không kèm sid)';
      if (sid) {
        console.log('[Demo] Nhận được sid:', sid);
        // gắn sid vào ad request thực tế của bạn ở đây
      } else {
        console.log('[Demo] Không có sid — gửi ad request không cá nhân hoá.');
      }
    });
  </script>
</body>
</html>
